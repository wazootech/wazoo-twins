name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Format, lint, type check and tests all run on Bun (bun run ci). Bun floats
  # on 1.x on purpose so a Bun regression surfaces early. The tests use
  # in-memory worlds and stubs, so CI makes no web-search or model calls.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run ci
